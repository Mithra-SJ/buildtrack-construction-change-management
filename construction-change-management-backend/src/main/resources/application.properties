spring.application.name=construction-change-management
server.port=8080

# PostgreSQL connection. Override these values for your local database.
spring.datasource.url=jdbc:postgresql://localhost:5433/construction_db?options=-c%20TimeZone%3DAsia%2FKolkata
spring.datasource.username=construction_user
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Development setting: Hibernate creates/updates tables from entity classes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Return useful validation errors.
server.error.include-message=always

buildtrack.impact-engine.url=http://127.0.0.1:8001
