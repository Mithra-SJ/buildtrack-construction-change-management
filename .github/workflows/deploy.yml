
name: BuildTrack EC2 Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      
      # - name: Diagnose GitHub OIDC claims
      #   shell: bash
      #   run: |
      #     set -euo pipefail

      #     TOKEN=$(curl -fsS \
      #       -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
      #       "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
      #       | jq -er '.value')

      #     OIDC_TOKEN="$TOKEN" python3 -c '
      #     import os, json, base64
      #     token = os.environ["OIDC_TOKEN"]
      #     payload = token.split(".")[1]
      #     payload += "=" * (-len(payload) % 4)
      #     claims = json.loads(base64.urlsafe_b64decode(payload))
      #     for key in ["iss", "aud", "sub"]:
      #         print(f"{key}: {claims.get(key)}")
      #     '


      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::662371887318:role/BuildTrack-GitHubActions-Deploy-Role
          aws-region: ap-south-1

      - name: Deploy application through AWS SSM
        shell: bash
        env:
          INSTANCE_ID: i-0a0d0486b4f15e705
        run: |
          set -euo pipefail

          PARAMS=$(jq -n '{
            commands: [
              "set -e",
              "sudo -u ubuntu -H bash -lc '\''cd /home/ubuntu/buildtrack-app && git fetch origin main && git reset --hard origin/main && docker compose -p buildtrack-deploy --env-file /home/ubuntu/buildtrack-deploy/.env.prod -f /home/ubuntu/buildtrack-app/docker-compose.prod.yml up -d --build impact-engine backend frontend'\''"
            ]
          }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "BuildTrack deployment from GitHub Actions" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "BuildTrack deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed. Check the SSM command output in AWS."
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment timed out while waiting for SSM."
          exit 1
